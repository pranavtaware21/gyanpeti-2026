# Build and publish to GitHub Pages.
#
# The image derivatives are gitignored — they are generated from img-source/
# by `npm run assets`, so that step has to run here before the build or the
# site deploys with every photograph missing.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never two deploys at once; let a newer push finish rather than the older one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Re-encoding the photographs is ~129s of a ~165s deploy: thirty images
      # at up to four widths in three formats, and AVIF is slow. They change
      # very rarely, so cache the output and key it on the only two things
      # that can invalidate it — the originals themselves, and the encoder
      # settings in the pipeline script.
      - name: Cache image derivatives
        id: derived
        uses: actions/cache@v4
        with:
          path: public/img/derived
          key: derived-${{ hashFiles('img-source/**', 'scripts/process-assets.mjs') }}

      - name: Process photographs
        if: steps.derived.outputs.cache-hit != 'true'
        run: npm run assets

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
